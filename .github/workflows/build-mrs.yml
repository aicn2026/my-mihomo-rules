name: Build MRS Rules

on:
  push:
    paths:
      - 'yaml/*.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Mihomo
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "已获取最新内核版本: $LATEST_TAG"
          wget -O mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-${LATEST_TAG}.gz"
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

      - name: Compile YAML to MRS
        run: |
          echo "开始转换规则..."
          for file in yaml/*.yaml; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .yaml)
              echo "正在编译: $filename.yaml -> $filename.mrs"
              mihomo convert-ruleset domain yaml "$file" "$filename.mrs"
            fi
          done

      - name: Commit, Push and Purge JSDMirror Cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          CHANGED_FILES=$(git diff --staged --name-only)
          if [ -n "$CHANGED_FILES" ]; then
            echo "检测到以下规则文件已更新: $CHANGED_FILES"
            git commit -m "Auto compile MRS rules [skip ci]"
            git push
            echo "等待 10 秒确保 GitHub 源站同步完成..."
            sleep 10
            for mrs_file in $CHANGED_FILES; do
              echo "正在清理缓存: $mrs_file"
              curl -s -X POST "https://cache.jsdmirror.com/api/v1/purge" \
                -H "Content-Type: application/json" \
                -H "X-API-Key: ${{ secrets.JSD_API_KEY }}" \
                -d "{\"url\": \"https://cdn.jsdmirror.com/gh/aicn2026/my-mihomo-rules@main/${mrs_file}\", \"method\": \"invalidate\"}"
              echo ""
            done
          else
            echo "规则无变化，跳过提交与缓存清理。"
          fi