name: Build MRS Rules

on:
  push:
    paths:
      - 'yaml/*.yaml'
      - '*.list'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Mihomo
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "已获取最新内核版本: $LATEST_TAG"
          wget -O mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-${LATEST_TAG}.gz"
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

      - name: Compile YAML to MRS
        run: |
          echo "开始转换规则..."
          for file in yaml/*.yaml; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .yaml)
              echo "正在编译: $filename.yaml -> $filename.mrs"
              mihomo convert-ruleset domain yaml "$file" "$filename.mrs"
            fi
          done

      - name: Commit, Push and Purge JSDMirror Cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          CHANGED_MRS=$(git diff --staged --name-only)

          BEFORE_SHA="${{ github.event.before }}"
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_LIST=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" -- '*.list' 2>/dev/null || true)
          else
            CHANGED_LIST=$(git diff --name-only HEAD~1 HEAD -- '*.list' 2>/dev/null || true)
          fi

          if [ -n "$CHANGED_MRS" ]; then
            git commit -m "Auto compile MRS rules [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

          ALL_CHANGED=$(echo "$CHANGED_MRS $CHANGED_LIST" | tr ' ' '\n' | sort -u | xargs)

          if [ -n "$ALL_CHANGED" ]; then
            echo "检测到以下规则文件已更新: $ALL_CHANGED"
            echo "等待 10 秒确保 GitHub 源站同步完成..."
            sleep 10
            FILES=($ALL_CHANGED)
            TOTAL=${#FILES[@]}
            COUNT=0
            for target_file in "${FILES[@]}"; do
              COUNT=$((COUNT + 1))
              MAX_RETRIES=3
              ATTEMPT=1
              SUCCESS=false

              while [ $ATTEMPT -le $MAX_RETRIES ]; do
                echo "[$COUNT/$TOTAL] 正在清理缓存: $target_file (第 $ATTEMPT 次尝试)"
                RESP=$(curl -sS --max-time 30 -X POST "https://cache.jsdmirror.com/api/v1/purge" \
                  -H "Content-Type: application/json" \
                  -H "X-API-Key: ${{ secrets.JSD_API_KEY }}" \
                  -d "{\"url\": \"https://cdn.jsdmirror.com/gh/aicn2026/my-mihomo-rules@main/${target_file}\", \"method\": \"delete\"}" 2>&1 || true)
                echo "$RESP"

                if echo "$RESP" | grep -q '"success":true'; then
                  SUCCESS=true
                  break
                else
                  if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                    echo "清理失败或触发限流，等待 35 秒后重试..."
                    sleep 35
                  fi
                fi
                ATTEMPT=$((ATTEMPT + 1))
              done

              if [ "$SUCCESS" = false ]; then
                echo "⚠️ 警告: $target_file 连续 $MAX_RETRIES 次清理失败，请稍后手动检查。"
              fi

              if [ $((COUNT % 2)) -eq 0 ] && [ "$COUNT" -lt "$TOTAL" ]; then
                echo "已达每分钟 2 次频率限制，等待 65 秒后继续清理剩余文件..."
                sleep 65
              fi
            done
          else
            echo "规则无变化，跳过缓存清理。"
          fi